<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Migratoria - Perfil</title>

    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./img/ico-CM.ico">
    <link rel="stylesheet" href="./css/nav-footer.css">

    <script src="./js/demo-store.js"></script>
    <script>CM.exigirLogin();</script>
    <link rel="stylesheet" href="./css/repaginada.css">
</head>

<body>

<div id="cm-topo"></div>
<script src="./js/layout.js"></script>


<section>
    <h1>Perfil do Imigrante</h1>

    <div class="container">
        <div class="alinar-1">
            <div class="inputs-image">
                <h1 id="nomeTitulo"></h1>
                <div>
                    <div class="excluir-foto">
                        <button type="button" id="excluirFoto" title="Excluir foto" aria-label="Excluir foto">
                            <img src="./img/lixeira-de-reciclagem.png" alt="">
                        </button>
                    </div>
                    <img class="foto-perfil" id="fotoPerfil" src="./img/perfil-de-usuario.png" alt="Foto de perfil">
                </div>

                <!-- Upload de imagem (fica salva no navegador, redimensionada) -->
                <div class="upload-ft">
                    <input type="file" id="profile_picture" accept="image/png, image/jpeg, image/webp" hidden>
                    <button type="button" onclick="document.getElementById('profile_picture').click()">Upload foto</button>
                </div>
            </div>
        </div>

        <div class="alinar-2">
            <div class="inputs-infos">
                <div class="pt-perfil">
                    <div class="ali-tlt">
                        <div class="titulo-infos-perfil">
                            <h1>Informações de usuário</h1>
                        </div>
                        <button type="button" class="editar" id="botaoEditar">
                            <span class="editar-icone"><img src="./img/editar.png" alt="" id="editarIcone"></span>
                            <p id="editarTexto">Editar</p>
                        </button>
                    </div>

                    <form id="formDados">
                        <div class="infos-perfil">
                            <div class="infos-perfil-alinhar">
                                <div>
                                    <h2><label for="nomeInput">Nome</label></h2>
                                    <input type="text" name="nome" id="nomeInput" required readonly>
                                </div>
                                <div>
                                    <h2><label for="emailInput">E-mail</label></h2>
                                    <input type="email" name="email" id="emailInput" required readonly>
                                </div>
                            </div>
                            <div class="infos-perfil-alinhar">
                                <div>
                                    <h2><label for="telefoneInput">Telefone</label></h2>
                                    <input type="tel" name="telefone" id="telefoneInput" readonly>
                                </div>
                                <div>
                                    <h2><label for="nacionalidadeInput">Nacionalidade</label></h2>
                                    <input type="text" name="nacionalidade" id="nacionalidadeInput" readonly>
                                </div>
                            </div>
                            <div class="infos-perfil-alinhar">
                                <div>
                                    <h2><label for="senhaInput">Senha</label></h2>
                                    <input type="password" name="senha" id="senhaInput" placeholder="••••••••" autocomplete="new-password" minlength="4" readonly>
                                </div>
                                <div class="salvar-alt">
                                    <button type="submit" id="salvarButton" disabled>SALVAR ALTERAÇÕES</button>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div class="sair-caonta">
                        <button type="button" data-sair>SAIR DA MINHA CONTA</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="./js/perfil.js"></script>
</body>
</html>
