<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Migratoria - Nova Senha</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/x-icon" href="./img/ico-CM.ico">
    <script src="./js/demo-store.js"></script>
    <link rel="stylesheet" href="./css/repaginada.css">
</head>
<body>
    <section>
        <div class="infos">
            <a href="./index.html" class="voltar-site">&larr; Voltar para o site</a>
                        <h1>NOVA SENHA</h1>
            <img src="./img/logo-branca-conexion-migratoria.png" alt="">
            <a href="./logar.html"><button class="creat">VOLTAR AO LOGIN</button></a>
        </div>

        <div id="login1" class="login1">
            <h1 class="title">CRIAR NOVA SENHA</h1>
            <form id="resetForm">
                <div class="input">
                    <img src="./img/cadeado.png" style="filter: brightness(0) invert(1);">
                    <div></div>
                    <input type="password" name="nova_senha" placeholder="Nova Senha" autocomplete="new-password" minlength="4" required>
                </div>
                <div class="input">
                    <img src="./img/cadeado.png" style="filter: brightness(0) invert(1);">
                    <div></div>
                    <input type="password" name="conf_senha" placeholder="Confirmar Nova Senha" required>
                </div>
                <div class="botao">
                    <input type="submit" name="redefinir" id="submit" value="REDEFINIR SENHA">
                </div>
            </form>
        </div>
    </section>
    <script src="./js/conta.js"></script>
</body>
</html>
