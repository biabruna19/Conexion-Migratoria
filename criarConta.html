<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Migratoria - Login</title>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/x-icon" href="./img/ico-CM.ico">

    <script src="./js/demo-store.js"></script>
    <link rel="stylesheet" href="./css/repaginada.css">
</head>

    
<body>
    <section>
        <div class="infos">
            <a href="./index.html" class="voltar-site">&larr; Voltar para o site</a>
                        <h1>BEM VINDO!</h1>
            <img src="./img/logo-branca-conexion-migratoria.png" alt="">
            <a href="./logar.html"><button class="creat" type="button">JÁ TENHO CONTA</button></a>
        </div>

        <div id="login2" class="login2">
            <h1 class="title">CRIAR CONTA</h1>
            <form id="registerForm">
                <div class="alinhar">
                    <div class="input">
                        <img src="./img/do-utilizador.png">
                        <div></div>
                        <input type="text" name="nome" placeholder="Nome" autocomplete="name" required>
                    </div>
                    <div class="input">
                        <img src="./img/o-email.png">
                        <div></div>
                        <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
                    </div>
                </div>

                <div class="alinhar">
                    <div class="input">
                        <img src="./img/telefone.png">
                        <div></div>
                        <input type="tel" name="telefone" placeholder="Telefone" autocomplete="tel" required>
                    </div>
                    <div class="input">
                        <img src="./img/cidadania.png">
                        <div></div>
                        <input type="text" name="nacionalidade" placeholder="Nacionalidade" required>
                    </div>
                </div>

                <div class="alinhar">
                    <div class="input">
                        <img src="./img/cadeado.png">
                        <div></div>
                        <input type="password" name="senha" placeholder="Senha" autocomplete="new-password" minlength="4" required>
                    </div>
                    <div class="input">
                        <img src="./img/cadeado.png">
                        <div></div>
                        <input type="password" name="conf_senha" placeholder="Confirmar senha" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="botao">
                    <input type="submit" name="submit" id="submit" value="CRIAR">
                </div>
            </form>
        </div>
    </section>
    <script src="./js/conta.js"></script>
</body>
</html>
